services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agal
      POSTGRES_PASSWORD: agal
      POSTGRES_DB: agal
    ports:
      - "5432:5432"
    volumes:
      - agal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    # DATABASE_URL comes from .env now -- point it at the local `db`
    # service (postgresql+asyncpg://agal:agal@db:5432/agal) for local dev,
    # or at a real Postgres (e.g. Neon) for anything reachable outside
    # this machine. This used to hardcode the local `db` URL here, which
    # silently overrode whatever .env said -- env_file and environment
    # both set the same var, and environment always wins.
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  agal_db_data:
