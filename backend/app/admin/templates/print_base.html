<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} - {{ app_name }}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <link rel="stylesheet" href="/admin/static/print.css">
  <script src="/admin/static/admin.js" defer></script>
</head>
<body class="print-doc">
  <div class="print-toolbar no-print">
    <button type="button" class="btn btn-primary" data-print>Print</button>
    <a class="btn" href="{{ back_url }}">Back</a>
    <span class="muted small">Use the print dialog to print or save as PDF.</span>
  </div>

  <main class="sheet">
    <header class="report-head">
      <div class="report-org">{{ app_name }}</div>
      <h1>{% block heading %}{{ title }}{% endblock %}</h1>
      <dl class="report-meta">
        {% block meta %}{% endblock %}
        <div><dt>Generated</dt><dd>{{ generated_at|dt }}</dd></div>
        <div><dt>Generated by</dt><dd>{{ generated_by }}</dd></div>
      </dl>
    </header>

    {% block body %}{% endblock %}

    <footer class="report-foot">{{ app_name }} | Super Admin report | Confidential</footer>
  </main>
</body>
</html>
