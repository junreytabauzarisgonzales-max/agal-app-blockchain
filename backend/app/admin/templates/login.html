{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="auth-wrap">
  <form class="card auth-card" method="post" action="/admin/login" autocomplete="on">
    <h1>Super Admin</h1>
    <p class="muted">{{ app_name }}</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autofocus autocomplete="username" maxlength="320">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="1024">
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</main>
{% endblock %}
