{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<main class="auth-wrap">
  <div class="card auth-card" role="alert">
    <h1>{{ title }}</h1>
    <p class="muted">Error {{ status_code }}</p>
    <p>{{ message }}</p>
    <p><a class="btn btn-primary" href="/admin">Back to the admin</a></p>
  </div>
</main>
{% endblock %}
